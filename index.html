<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>JogoJusto — Estratégia e expressão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face {
  font-family: 'DSEG7';
  src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
  font-weight: 700; font-display: swap;
}
/* tokens do deck de referência (index-copia.html); --muted e --text clareados para projetor */
:root {
  --g: 0.7;
  --logo: #FF7A18; --cyan: #00E6DF; --magenta: #FF2D9B;
  --white: #EEF1F8; --muted: #a9acc0; --text: #dfe2ee;
  --line: rgba(255,255,255,.18);
}
html, body { margin: 0; height: 100%; background: #05050b; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; cursor: default; }
#stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage > canvas.world { image-rendering: pixelated; }
#stage > canvas.led { pointer-events: none; }
#stage > div { position: absolute; inset: 0; }

/* ── abertura: tela preta com o nome vazado; a fenda é o miolo do último O ── */
#intro { z-index: 5; overflow: hidden; pointer-events: none; display: flex; align-items: center; justify-content: center; }
#intro { animation: intro-in .5s both; }
@keyframes intro-in { from { opacity: 0; } }
#intro .hole { position: absolute; width: 0; height: 0; border-radius: 26% / 20%; box-shadow: 0 0 0 400vmax #000; }   /* o preto é a sombra: o furo é o próprio elemento */
#intro .word { position: relative; font: 700 calc(var(--W) * .125) / 1 'Chakra Petch', sans-serif; text-transform: uppercase; white-space: nowrap; color: transparent; -webkit-text-stroke: max(1.5px, calc(var(--W) * .0013)) rgba(238,241,248,.55); will-change: transform, opacity; }
#intro .justo { transition: color .9s, text-shadow .9s, -webkit-text-stroke-color .9s; }
#intro.lit .justo { color: var(--white); -webkit-text-stroke-color: transparent; text-shadow: 0 0 calc(10px*var(--g)) var(--cyan), 0 0 calc(30px*var(--g)) color-mix(in srgb, var(--cyan) 45%, transparent); }
#stage.pano .slide * { text-shadow: none !important; box-shadow: none !important; }

/* ── tela final: frase de fechamento no lado vazio da panorâmica; entra depois que a câmera pousa ── */
#fim { z-index: 4; pointer-events: none; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; padding-left: calc(var(--W) * .045);
  background: linear-gradient(90deg, rgba(5,5,11,.9), rgba(5,5,11,.62) 30%, transparent 48%);
  font-family: 'Chakra Petch', sans-serif; opacity: 0; transition: opacity .5s; }
#stage.fim #fim { opacity: 1; transition: opacity 1.2s 1.6s; }
#fim p { margin: 0; max-width: 11em; font-size: calc(var(--W) * .028); font-weight: 700; line-height: 1.08; text-transform: uppercase; color: var(--white); text-wrap: balance; }
#fim .tagline { width: calc(var(--W) * .36); margin-top: calc(var(--W) * .022); font-size: calc(var(--W) * .0115); }   /* telões pequenos e ao longe: o brilho não aparece e custa fps */

/* ── telão: canvas fixo 1600×900. O fundo animado vem do shader atrás; aqui só o véu escuro e o grid ── */
.slide {
  --acc: var(--cyan);
  width: 1600px; height: 900px; box-sizing: border-box;
  font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 30px; color: var(--text); letter-spacing: .01em;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 46px 46px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 46px 46px,
    rgba(5,6,14,.68);
  border: 2px solid color-mix(in srgb, var(--acc) 55%, transparent);
}
.slide h1, .slide h2, .slide h3 { margin: 0; text-transform: uppercase; color: var(--white); font-weight: 700; text-wrap: balance; }
.slide p, .slide ul { margin: 0; padding: 0; list-style: none; }
.neon-o { color: var(--logo); text-shadow: 0 0 calc(10px*var(--g)) var(--logo), 0 0 calc(34px*var(--g)) color-mix(in srgb, var(--logo) 55%, transparent); }
.neon-c { color: var(--cyan); text-shadow: 0 0 calc(10px*var(--g)) var(--cyan), 0 0 calc(30px*var(--g)) color-mix(in srgb, var(--cyan) 50%, transparent); }
.neon-w { color: var(--white); text-shadow: 0 0 calc(10px*var(--g)) var(--cyan), 0 0 calc(30px*var(--g)) color-mix(in srgb, var(--cyan) 45%, transparent); }
.hl { color: var(--acc); text-shadow: 0 0 calc(10px*var(--g)) var(--acc), 0 0 calc(30px*var(--g)) color-mix(in srgb, var(--acc) 50%, transparent); }
.digits { font-family: 'DSEG7', monospace; font-weight: 700; letter-spacing: .05em; }

.frame { position: absolute; inset: 0; padding: 26px 76px 22px; display: flex; flex-direction: column; gap: 26px; }
.corner { position: absolute; width: 26px; height: 26px; border: 0 solid var(--cyan); }   /* sem filter/mask nos telões: cada um vira um passe extra por quadro na panorâmica */
.corner.tl { top: 14px; left: 14px; border-width: 3px 0 0 3px; }
.corner.tr { top: 14px; right: 14px; border-width: 3px 3px 0 0; }
.corner.bl { bottom: 14px; left: 14px; border-width: 0 0 3px 3px; }
.corner.br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; }

/* faixa de canal: bloco de cor cheia, como cabeçalho de telão */
.bar { display: flex; align-items: center; gap: 24px; font-size: 22px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
/* cantos facetados por gradiente, não clip-path: recorte em dez telões 3D derruba o fps da panorâmica */
.chip { color: #05050b; font-weight: 700; padding: 9px 20px 8px; background: linear-gradient(135deg, transparent 7px, var(--acc) 7px) 0 0 / 51% 100% no-repeat, linear-gradient(-45deg, transparent 7px, var(--acc) 7px) 100% 0 / 51% 100% no-repeat; }
.bar .passo { color: var(--text); }
.bar .brand { margin-left: auto; font-size: 26px; font-weight: 700; letter-spacing: .04em; }
.bar .brand b { color: var(--logo); } .bar .brand i { font-style: normal; color: var(--white); }

.head { display: flex; flex-direction: column; gap: 14px; }
.head h2 { font-size: 68px; line-height: 1; max-width: 20em; }
.head .sub { font-size: 31px; line-height: 1.3; color: var(--muted); max-width: 40em; }

.body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.nota { display: flex; align-items: center; gap: 16px; font-size: 22px; color: var(--muted); letter-spacing: .03em; }
.tag { flex: none; font-size: 18px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--acc); border: 2px solid var(--acc); padding: 3px 10px 2px; }

/* rodapé = letreiro corrido + número */
.foot { display: flex; align-items: center; gap: 30px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 21px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.tick { flex: 1; overflow: hidden; white-space: nowrap; }
/* só o telão atual anima: letreiro animado vira camada larga na GPU, e dez delas derrubam a panorâmica */
.run { display: inline-block; }
.slide.on .run { animation: tick 45s linear infinite; }
.run em { font-style: normal; color: var(--acc); padding: 0 22px; }
@keyframes tick { to { transform: translateX(-50%); } }
.foot .num { font-family: 'DSEG7', monospace; font-size: 24px; letter-spacing: .05em; color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }

/* capa */
.cover { display: grid; grid-template-columns: 1.5fr 1fr; align-items: center; gap: 60px; }
.cover h1 { font-size: 172px; line-height: .88; }
.tagline { display: flex; align-items: center; margin-top: 26px; font-size: 26px; font-weight: 600; letter-spacing: .34em; color: var(--white); }
.tagline::before { content: ""; width: 10px; height: 10px; background: var(--magenta); transform: rotate(45deg); margin-right: 18px; box-shadow: 0 0 calc(7px*var(--g)) var(--magenta); }
.tagline::after { content: ""; flex: 1; height: 1px; margin-left: 20px; background: linear-gradient(90deg, var(--magenta), transparent); }
.cover-sub { margin-top: 52px !important; font-size: 44px; font-weight: 600; color: var(--white); text-transform: uppercase; letter-spacing: .06em; line-height: 1.1; }
.cover-sub span { display: block; font-size: 26px; letter-spacing: .24em; color: var(--muted); margin-top: 14px; }
.agenda { display: flex; flex-direction: column; gap: 22px; }
.agenda div { padding: 22px 26px; border-left: 6px solid var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
.agenda b { display: block; font-size: 22px; letter-spacing: .26em; color: var(--acc); }
.agenda span { font-size: 38px; font-weight: 700; text-transform: uppercase; color: var(--white); line-height: 1.1; }

/* colunas */
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 36px; }
.cols > div { border-top: 3px solid color-mix(in srgb, var(--acc) 55%, transparent); padding: 20px 22px 22px 0; display: flex; flex-direction: column; gap: 12px; }
.cols .n { font-size: 22px; font-weight: 700; letter-spacing: .26em; color: var(--acc); display: flex; align-items: center; gap: 14px; }
.cols h3 { font-size: 40px; line-height: 1; }
.cols .v { font-size: 30px; line-height: 1.28; color: var(--text); }
.cols .pq { font-size: 25px; line-height: 1.3; color: var(--white); margin-top: auto !important; padding-top: 12px; border-top: 1px solid var(--line); }
.cols .pq b { display: block; font-size: 18px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.cols > .hot { border-top-color: var(--acc); background: color-mix(in srgb, var(--acc) 13%, transparent); padding-left: 22px; }
.cols .hot .tag { background: var(--acc); color: #05050b; }

/* linhas chave/valor */
.rows > div { display: grid; grid-template-columns: 250px 1fr; gap: 30px; align-items: baseline; padding: 17px 0; border-bottom: 1px solid var(--line); }
.rows > div:first-child { border-top: 1px solid var(--line); }
.rows .k { font-size: 25px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--acc); }
.rows .v { font-size: 33px; font-weight: 500; line-height: 1.25; color: var(--white); }

/* números da escuta */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; }
.stats > div { border-top: 3px solid var(--line); padding-top: 14px; }
.stats .n { font-size: 116px; font-weight: 700; line-height: 1; color: var(--white); font-variant-numeric: tabular-nums; }
.stats .hot .n { color: var(--acc); text-shadow: 0 0 calc(18px*var(--g)) color-mix(in srgb, var(--acc) 60%, transparent); }
.stats .hot { border-top-color: var(--acc); }
.stats .l { font-size: 28px; line-height: 1.25; color: var(--text); margin-top: 8px; }
.fecho { font-size: 46px; font-weight: 700; text-transform: uppercase; color: var(--white); line-height: 1.05; }

/* dois painéis facetados */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.panel { background: rgba(8,10,22,.6); border: 1px solid var(--line); padding: 22px 28px 24px; }
.panel h3 { font-size: 24px; letter-spacing: .2em; margin-bottom: 12px; }
.panel.a { border-color: color-mix(in srgb, var(--cyan) 55%, transparent); } .panel.a h3 { color: var(--cyan); }
.panel.b { border-color: color-mix(in srgb, var(--acc) 60%, transparent); } .panel.b h3 { color: var(--acc); }
.panel li { position: relative; font-size: 29px; line-height: 1.28; color: var(--white); padding: 8px 0 8px 26px; }
.panel li::before { content: ""; position: absolute; left: 0; top: .82em; width: 12px; height: 2px; background: currentColor; opacity: .7; }
.swatches { display: flex; align-items: center; gap: 8px; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.swatches i { width: 70px; height: 30px; }
.swatches span { margin: 0 18px 0 8px; }

/* moodboard: mosaico de telas */
.mood { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 232px; gap: 18px; }
.tile { display: flex; flex-direction: column; border: 1px solid var(--line); background: rgba(8,10,22,.55); overflow: hidden; }
.tile .vis { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; gap: 20px; overflow: hidden; }
.tile .cap { padding: 9px 16px 11px; border-top: 1px solid var(--line); font-size: 23px; line-height: 1.2; color: var(--white); }
.tile .cap b { display: block; font-size: 17px; letter-spacing: .24em; text-transform: uppercase; color: var(--acc); margin-bottom: 2px; }
.vis.led { background: linear-gradient(100deg, transparent 10%, rgba(4,18,26,.78) 45%, transparent 80%), radial-gradient(circle, var(--cyan) 36%, transparent 40%) 0 0 / 12px 12px, #04121a; }
.vis.paleta { gap: 0; align-items: stretch; } .vis.paleta i { flex: 1; }
.vis.tipo .aa { font-size: 96px; font-weight: 700; color: var(--white); line-height: 1; }
.vis.tipo .digits { font-size: 46px; }
.vis.refs { flex-direction: column; gap: 4px; font-size: 27px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--white); }
.vis.refs span:nth-child(2) { color: var(--cyan); } .vis.refs span:nth-child(3) { color: var(--magenta); }
.vis.pixel { align-items: flex-end; gap: 6px; padding: 0 18px; background: linear-gradient(#170a33, #3a1450 60%, #0f5e66); }
.vis.pixel i { flex: 1; background: repeating-linear-gradient(0deg, transparent 0 6px, #0a0a18 6px 12px), repeating-linear-gradient(90deg, #ffb14a 0 6px, #0a0a18 6px 12px); border-top: 4px solid var(--cyan); }
.vis.pixel i:nth-child(odd) { background: repeating-linear-gradient(0deg, transparent 0 6px, #0a0a18 6px 12px), repeating-linear-gradient(90deg, #39d6d0 0 6px, #0a0a18 6px 18px); border-top-color: var(--magenta); }
.vis.rotulo span { background: var(--white); color: #05050b; font-size: 32px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1.05; padding: 14px 26px; border: 6px solid #05050b; outline: 3px solid var(--white); }

/* tom de voz */
.voz { display: grid; grid-template-columns: 250px 1fr 44px 1.08fr; column-gap: 24px; align-items: center; }
.voz > * { padding: 15px 0; border-bottom: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
.voz .th { font-size: 20px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); padding: 0 0 10px; }
.voz .th.to { color: var(--acc); }
.voz .k { font-size: 24px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); line-height: 1.15; }
.voz .de { font-size: 27px; line-height: 1.25; color: var(--muted); }
.voz .arr { color: var(--acc); font-size: 34px; font-weight: 700; justify-content: center; }
.voz .para { font-size: 31px; font-weight: 600; line-height: 1.22; color: var(--white); }

/* brand canvas: a plataforma inteira numa grade 4×3, com os mesmos filetes das colunas */
.canvas { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 30px; row-gap: 24px; }
.canvas > div { border-top: 2px solid color-mix(in srgb, var(--acc) 45%, transparent); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.canvas b { font-size: 18px; letter-spacing: .24em; text-transform: uppercase; color: var(--acc); }
.canvas p { font-size: 29px; font-weight: 500; line-height: 1.22; color: var(--white); }
.canvas > .hot { border-top: 3px solid var(--acc); background: color-mix(in srgb, var(--acc) 13%, transparent); padding: 12px 16px 14px; }
</style>
</head>

<div id="stage"></div>

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { paintFacade } from './mundo/fachadas.js';
import buildAtmosphere from './mundo/atmosfera.js';
import buildStreet from './mundo/rua.js';

/* ═══════════════════════════════════════════════════════════════
   CONTEÚDO DOS TELÕES — edite só aqui.
   etapa: 'diagnostico' (ciano), 'estrategia' (laranja) ou 'expressao' (magenta).
   titulo + destaque formam o título (destaque sai em neon).
   corpo.tipo: 'cols' | 'rows' | 'stats' | 'duo' | 'mood' | 'voz' | 'canvas'.
   nota: linha pequena no fim; proposta: true põe a etiqueta PROPOSTA.
   ═══════════════════════════════════════════════════════════════ */

const ETAPAS = { diagnostico: { nome: 'Diagnóstico', cor: 'var(--cyan)' }, estrategia: { nome: 'Estratégia de marca', cor: 'var(--logo)' }, expressao: { nome: 'Expressão de marca', cor: 'var(--magenta)' } };

  // ───────── DIAGNÓSTICO ─────────

  { etapa: 'estrategia', passo: 'Escolhas e justificativas',

/* ── shaders dos telões ── */
const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }';
// fundo do telão, no render de baixa resolução: faixas de cor em degraus que deslizam devagar
const BACK_FRAG = `
uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
void main(){
  float w = sin((vUv.x * 2.2 - vUv.y * 1.4) * 6.2831 + uTime * .3) * .5 + .5;
  vec3 col = mix(vec3(.03, .035, .09), uColor, floor(w * 6.) / 6. * .36);
  col += uColor * .34 * pow(1. - vUv.y, 4.);      // brilho subindo da base
  gl_FragColor = vec4(col, 1.);
  #include <colorspace_fragment>
}`;
// máscara por cima do HTML: grade de LEDs, faixa de refresh, e o acendimento de cima para baixo
const LED_FRAG = `
uniform float uTime, uOn, uCells, uMask; varying vec2 vUv;
void main(){
  vec2 g = vUv * vec2(uCells, uCells * 9. / 16.);
  vec2 f = abs(fract(g) - .5);
  float cell = 1. / max(fwidth(g.x), fwidth(g.y));            // tamanho do LED em pixels de tela
  float fade = clamp((cell - 2.) / 1.5, 0., 1.);              // some quando o LED fica pequeno (evita moiré no voo)
  float dark = smoothstep(.30, .5, max(f.x, f.y)) * .26 * fade * uMask;
  float y = 1. - vUv.y;
  dark = max(dark, step(uOn, y) * .62);                        // parte ainda apagada
  float light = smoothstep(.05, 0., abs(fract(y - uTime * .06) - .5)) * .035 * uMask;   // faixa de refresh
  light += smoothstep(.025, 0., abs(y - uOn)) * step(.001, uOn) * step(uOn, .999) * .8; // linha de acendimento
  gl_FragColor = vec4(vec3(light), clamp(dark + light, 0., 1.));
}`;

}

/* ── navegação ── */
let idx = Math.min(STOPS.length - 1, Math.max(0, (parseInt(location.hash.replace(/\D/g, ''), 10) || 1) - 1));
camera.position.copy(STOPS[idx].p); camera.quaternion.copy(STOPS[idx].q);
let anim = null, flight = intro ? 0 : 1;
// tela de abertura: é a parada antes do slide 1 e só sai com um avanço, como qualquer slide
function showIntro() {
  intro = 'wait'; flight = 0; anim = null;
  introEl.classList.remove('lit'); wordEl.style.cssText = ''; holeEl.style.cssText = '';
  stage.append(introEl); camera.position.copy(introPath.getPoint(0)); camera.lookAt(lookA);
  history.replaceState(null, '', location.pathname + location.search);
}
if (intro) showIntro();
const fimEl = el('div'); fimEl.id = 'fim';
{ const p = el('p', '', FECHO.titulo + ' '); p.append(el('span', 'neon-c', FECHO.destaque), ' ' + FECHO.fim);
  fimEl.append(p, el('div', 'tagline', SLOGAN.toUpperCase())); stage.append(fimEl); }
const mark = () => { slideEls.forEach((e, i) => e.classList.toggle('on', i === idx)); stage.classList.toggle('pano', !!STOPS[idx].pano); stage.classList.toggle('fim', !!STOPS[idx].pano); };   // só o telão atual roda o letreiro; 'fim' separado de 'pano' porque a abertura também usa 'pano'
mark();
function go(n) {
  if (intro) { if (intro === 'wait' && n > idx) startIntro(); return; }
  if (n < 0 && idx === 0) { showIntro(); return; }   // seta esquerda no slide 1 volta à tela de abertura
  n = Math.max(0, Math.min(STOPS.length - 1, n));
  if (n === idx) return;
  const hop = !STOPS[idx].pano && !STOPS[n].pano, to = STOPS[n];
  const h = hop && SLIDES[idx].etapa === SLIDES[n].etapa ? HOP_IN : HOP;
  anim = { p0: camera.position.clone(), q0: camera.quaternion.clone(), p1: to.p, q1: to.q, t0: performance.now(), soft: h === HOP_IN,
           dur: hop ? h.dur : PANO_MS, arc: hop ? h.arc : 0, yaw: hop ? -Math.sign(to.p.x - camera.position.x) * h.yaw : 0 };
  idx = n; flight = 0; mark(); history.replaceState(null, '', '#' + (n + 1));
}
addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'l' || e.key === 'L') uMask.value = 1 - uMask.value;   // liga/desliga a grade de LED
});
// na panorâmica, clicar num telão ou no prédio dele leva direto àquele slide
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function lotAt(e) {
  const dom = slideEls.indexOf(e.target.closest?.('.slide'));
  if (dom >= 0) return dom;
  const r = stage.getBoundingClientRect();
  ray.setFromCamera(ndc.set((e.clientX - r.left) / r.width * 2 - 1, 1 - (e.clientY - r.top) / r.height * 2), camera);
  const hit = ray.intersectObjects(lotMeshes)[0];
  return hit ? lotMeshes.indexOf(hit.object) : -1;
}
stage.addEventListener('click', e => {
  if (!STOPS[idx].pano || anim) return go(idx + 1);
  const i = lotAt(e); if (i >= 0) go(i);
});
stage.addEventListener('mousemove', e => { stage.style.cursor = STOPS[idx].pano && !anim && lotAt(e) >= 0 ? 'pointer' : 'default'; });

/* ── 16:9 com letterbox; mundo em baixa resolução, telões em resolução cheia ── */
function resize() {
  const W = Math.min(innerWidth, innerHeight * 16 / 9), H = W * 9 / 16;
  stage.style.width = W + 'px'; stage.style.setProperty('--W', W + 'px'); stage.style.height = H + 'px';
  const k = Math.max(2, Math.round(H / PIXEL_ROWS));
  renderer.setSize(Math.ceil(W / k), Math.ceil(H / k), false);
  css.setSize(W, H); ledRenderer.setSize(W, H, false);
  // largura do telão na tela, com a câmera parada; cada LED com um número inteiro de pixels
  for (const [u, fill] of [[uCells, FILL], [uCellsIn, FILL_IN]]) { const wp = W * fill; u.value = wp / Math.max(3, Math.round(wp / LED_COLS)); }
}
addEventListener('resize', resize); resize();

const Y = new THREE.Vector3(0, 1, 0), tq = new THREE.Quaternion();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  uTime.value = now / 1000;
  if (intro === 'run') {
    const t = (now - introT0) / 1000 - INTRO.cor;       // primeiro só a cor do JUSTO
    if (t > 0) {
      const z = Math.min(1, t / INTRO.zoom), sc = Math.pow(70, z * z * (3 - 2 * z)), open = Math.min(1, z * 10);
      if (z < 1) {
        wordEl.style.transform = `scale(${sc})`; wordEl.style.opacity = 1 - Math.max(0, Math.min(1, (z - .4) / .22));
        const hw = hole.w * sc * open, hh = hole.h * sc * open;
        holeEl.style.cssText = `left:${hole.x - hw / 2}px;top:${hole.y - hh / 2}px;width:${hw}px;height:${hh}px`;
      } else introEl.remove();
      const f = Math.min(1, t / INTRO.voo), e = f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
      camera.position.copy(introPath.getPoint(e));
      camera.lookAt(look.lerpVectors(lookA, lookB, Math.min(1, e / .8)));
      flight = f; stage.classList.toggle('pano', f < .8);   // de cima, dez telões na tela: mesmo corte de brilho da panorâmica
      if (f === 1) { intro = null; camera.position.copy(STOPS[0].p); camera.quaternion.copy(STOPS[0].q); }
    }
  }
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur), s0 = (1 - Math.cos(Math.PI * k)) / 2;   // salto suave: seno, pico de velocidade menor que o cúbico
    const e = anim.soft ? s0 : k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, s = Math.sin(Math.PI * e);
    camera.position.lerpVectors(anim.p0, anim.p1, e); camera.position.z += anim.arc * s;   // recua no meio do voo
    camera.quaternion.slerpQuaternions(anim.q0, anim.q1, e).multiply(tq.setFromAxisAngle(Y, anim.yaw * s));   // olha para onde vai
    flight = k;
    if (k === 1) anim = null;
  }
  // telão atual acende na segunda metade do voo; os outros apagam; na panorâmica, todos acesos
  const pano = STOPS[idx].pano;
  leds.forEach((u, i) => { const on = pano || (i === idx && flight > .45); u.value = Math.max(0, Math.min(1, u.value + (on ? 1 : -1) * dt / .55)); });
  for (const fn of frameFns) fn(dt, now);
  renderer.render(scene, camera);
  css.render(scene, camera);
  ledRenderer.render(ledScene, camera);
});
</script>
</body>
</html>
